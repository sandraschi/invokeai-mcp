[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invokeai-mcp"
version = "0.1.0"
description = "InvokeAI creative engine bridge - generate, queue, models, gallery, boards, workflows for Claude, Cursor, and the fleet webapp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.22", "ruff>=0.16.0,<0.17"]

[project.scripts]
invokeai-mcp = "invokeai_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invokeai_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "respx>=0.22",
    "ruff>=0.16.0,<0.17",
]
