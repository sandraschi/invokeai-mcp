repos:
  auto-update: true

ci:
  autofix_commit_msg: "chore(pre-commit): auto fixes"
  autofix_prs: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: biome
        name: biome (webapp)
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-biome.ps1
        language: system
        types_or: [ts, tsx, js, jsx, json]
        pass_filenames: false
